<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="cover-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14281C" />
      <stop offset="50%" stop-color="#1F3D2B" />
      <stop offset="100%" stop-color="#0E1B13" />
    </linearGradient>
    <linearGradient id="glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#DEAA85" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1F3D2B" stop-opacity="0" />
    </linearGradient>
    <pattern id="mughal-lattice" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 60 30 L 30 60 L 0 30 Z" stroke="#E6DDD3" stroke-width="0.8" fill="none" opacity="0.12" />
      <circle cx="30" cy="30" r="10" stroke="#DEAA85" stroke-width="0.6" fill="none" opacity="0.1" />
    </pattern>
  </defs>

  <!-- Deep Forest Green Background -->
  <rect width="1200" height="400" fill="url(#cover-bg)" />
  <rect width="1200" height="400" fill="url(#mughal-lattice)" />

  <!-- Ambient Light Cone -->
  <ellipse cx="600" cy="80" rx="400" ry="250" fill="url(#glow)" />

  <!-- Arch Silhouette Centerpiece -->
  <path d="M 500 400 L 500 240 C 500 170 550 140 600 120 C 650 140 700 170 700 240 L 700 400 Z" fill="#152B1E" stroke="#DEAA85" stroke-width="1.5" opacity="0.4" />
  <path d="M 530 400 L 530 260 C 530 200 565 175 600 160 C 635 175 670 200 670 260 L 670 400 Z" fill="#0C1710" opacity="0.6" />

  <!-- Pendant Amber Lantern -->
  <line x1="600" y1="0" x2="600" y2="160" stroke="#D49A73" stroke-width="1.5" opacity="0.6" />
  <polygon points="590,160 610,160 615,185 600,198 585,185" fill="#C96839" stroke="#FFE082" stroke-width="1" />
  <circle cx="600" cy="180" r="14" fill="#FFE082" opacity="0.5" filter="blur(4px)" />

  <!-- Restaurant Nameplate Badge -->
  <rect x="420" y="270" width="360" height="74" rx="12" fill="#0C1710" stroke="#DEAA85" stroke-width="1.5" opacity="0.9" />
  <text x="600" y="304" font-family="serif" font-size="22" font-weight="600" fill="#F7F5F0" text-anchor="middle" letter-spacing="1.5">THE MAPLE &amp; VINE</text>
  <text x="600" y="326" font-family="sans-serif" font-size="11" font-weight="500" fill="#DEAA85" text-anchor="middle" letter-spacing="3">WOOD-FIRED HEARTH • DETROIT</text>
</svg>
