<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8ECE9" />
      <stop offset="100%" stop-color="#D5DDD7" />
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D49A73" />
      <stop offset="100%" stop-color="#C2855F" />
    </linearGradient>
    <linearGradient id="shirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F3D2B" />
      <stop offset="100%" stop-color="#152B1E" />
    </linearGradient>
    <linearGradient id="hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#221C18" />
      <stop offset="100%" stop-color="#151210" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="80" cy="80" r="80" fill="url(#bg)" />
  
  <!-- Shoulders & Torso -->
  <path d="M 24 160 C 24 126 50 114 80 114 C 110 114 136 126 136 160 Z" fill="url(#shirt)" />
  
  <!-- Shirt Collar -->
  <path d="M 68 114 L 80 128 L 92 114 Z" fill="#F7F7F4" opacity="0.9" />

  <!-- Neck -->
  <rect x="71" y="90" width="18" height="28" rx="4" fill="url(#skin)" />
  <path d="M 71 100 Q 80 106 89 100 L 89 106 L 71 106 Z" fill="#A86E4A" opacity="0.4" />

  <!-- Head Base -->
  <ellipse cx="80" cy="68" rx="27" ry="33" fill="url(#skin)" />

  <!-- Ears -->
  <circle cx="53" cy="70" r="7" fill="url(#skin)" />
  <circle cx="107" cy="70" r="7" fill="url(#skin)" />

  <!-- Hair -->
  <path d="M 52 64 C 52 38 65 34 80 34 C 95 34 108 38 108 64 C 104 52 98 46 80 46 C 62 46 56 52 52 64 Z" fill="url(#hair)" />
  <path d="M 53 58 Q 50 42 66 38 Q 80 32 94 38 Q 110 42 107 58 Q 100 48 80 48 Q 60 48 53 58 Z" fill="url(#hair)" />

  <!-- Eyes -->
  <ellipse cx="69" cy="67" rx="3" ry="3.5" fill="#201A16" />
  <ellipse cx="91" cy="67" rx="3" ry="3.5" fill="#201A16" />
  <circle cx="70" cy="66" r="1" fill="#FFFFFF" />
  <circle cx="92" cy="66" r="1" fill="#FFFFFF" />

  <!-- Eyebrows -->
  <path d="M 63 60 Q 69 57 75 60" stroke="#1A1512" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M 85 60 Q 91 57 97 60" stroke="#1A1512" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Nose -->
  <path d="M 80 67 L 78 76 L 83 76" stroke="#A86E4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Smile -->
  <path d="M 73 83 Q 80 89 87 83" stroke="#8C5332" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Subtle Trim / Beard -->
  <path d="M 66 77 Q 80 98 94 77" stroke="#221C18" stroke-width="1.5" stroke-dasharray="1 2" stroke-linecap="round" fill="none" opacity="0.3" />
</svg>
