<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="chef-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2EDE4" />
      <stop offset="100%" stop-color="#E5DDD2" />
    </linearGradient>
    <linearGradient id="chef-skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DEAA85" />
      <stop offset="100%" stop-color="#C58E68" />
    </linearGradient>
    <linearGradient id="chef-coat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EDEDE8" />
    </linearGradient>
    <linearGradient id="chef-hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A332C" />
      <stop offset="100%" stop-color="#241F1A" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="80" cy="80" r="80" fill="url(#chef-bg)" />
  
  <!-- Shoulders & Chef Double-Breasted Coat -->
  <path d="M 22 160 C 22 124 50 112 80 112 C 110 112 138 124 138 160 Z" fill="url(#chef-coat)" stroke="#D5CFC6" stroke-width="1.5" />
  
  <!-- Chef Lapel & Collar (Mandarin Collar) -->
  <path d="M 66 112 L 80 126 L 94 112 Z" fill="#1F3D2B" opacity="0.95" />
  <path d="M 64 104 C 64 98 96 98 96 104 L 96 116 L 64 116 Z" fill="#FFFFFF" stroke="#D5CFC6" stroke-width="1" />
  
  <!-- Chef Coat Buttons (2 Columns) -->
  <circle cx="72" cy="136" r="2.5" fill="#1F3D2B" />
  <circle cx="72" cy="148" r="2.5" fill="#1F3D2B" />
  <circle cx="88" cy="136" r="2.5" fill="#1F3D2B" />
  <circle cx="88" cy="148" r="2.5" fill="#1F3D2B" />

  <!-- Neck -->
  <rect x="71" y="86" width="18" height="26" rx="4" fill="url(#chef-skin)" />
  <path d="M 71 96 Q 80 102 89 96 L 89 102 L 71 102 Z" fill="#B07750" opacity="0.35" />

  <!-- Head Base -->
  <ellipse cx="80" cy="66" rx="26" ry="31" fill="url(#chef-skin)" />

  <!-- Ears -->
  <circle cx="54" cy="68" r="6.5" fill="url(#chef-skin)" />
  <circle cx="106" cy="68" r="6.5" fill="url(#chef-skin)" />

  <!-- Short Professional Hair & Sideburns -->
  <path d="M 54 62 C 54 36 66 32 80 32 C 94 32 106 36 106 62 C 102 50 96 44 80 44 C 64 44 58 50 54 62 Z" fill="url(#chef-hair)" />
  <path d="M 54 56 Q 51 42 66 37 Q 80 33 94 37 Q 109 42 106 56 Q 100 46 80 46 Q 60 46 54 56 Z" fill="url(#chef-hair)" />

  <!-- Eyes -->
  <ellipse cx="70" cy="64" rx="3" ry="3.5" fill="#201A16" />
  <ellipse cx="90" cy="64" rx="3" ry="3.5" fill="#201A16" />
  <circle cx="71" cy="63" r="1" fill="#FFFFFF" />
  <circle cx="91" cy="63" r="1" fill="#FFFFFF" />

  <!-- Eyebrows -->
  <path d="M 64 57 Q 70 54 76 57" stroke="#241F1A" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M 84 57 Q 90 54 96 57" stroke="#241F1A" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Nose -->
  <path d="M 80 64 L 78 73 L 83 73" stroke="#B07750" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Warm Smile -->
  <path d="M 73 80 Q 80 86 87 80" stroke="#8C5332" stroke-width="2.2" stroke-linecap="round" fill="none" />

  <!-- Neatly Groomed Mustache / Beard -->
  <path d="M 72 76 Q 80 80 88 76 Q 80 77 72 76 Z" fill="#3A332C" opacity="0.8" />
  <path d="M 75 88 Q 80 92 85 88" stroke="#3A332C" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.6" />
</svg>
